[default_config]
version = "0.10.1"
assembler = "gas"
instruction_set = "x86-64"

[default_config.opts]
compiler = "gcc"
compile_flags_txt = [
    "-nostdinc",

    # Symlink to /usr/src/linux-headers-<version>-generic
    "-I/usr/src/linux-headers-generic/include",
    "-I/usr/src/linux-headers-generic/include/uapi",
    "-I/usr/src/linux-headers-generic/include/generated/uapi",
    "-I/usr/src/linux-headers-generic/arch/x86/include",
    "-I/usr/src/linux-headers-generic/arch/x86/include/uapi",
    "-I/usr/src/linux-headers-generic/arch/x86/include/generated",
    "-I/usr/src/linux-headers-generic/arch/x86/include/generated/uapi",
    "-include/usr/src/linux-headers-generic/include/linux/compiler-version.h",
    "-include/usr/src/linux-headers-generic/include/linux/kconfig.h",

    "-D__KERNEL__",
    "-D__ASSEMBLY__",
    "-DMODULE"
]
diagnostics = true
default_diagnostics = true
